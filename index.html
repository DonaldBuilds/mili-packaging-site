    <script>
      // v19: 流量埋点（1px beacon → /api/track → Supabase page_views，D1 自建埋点）
      (function () {
        try {
          if (localStorage.getItem('mili-track-off')) return;
          var sid = localStorage.getItem('mili-track-sid');
          if (!sid) { sid = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); localStorage.setItem('mili-track-sid', sid); }
          var ref = document.referrer || '';
          var source = 'direct';
          try {
            if (/google\.|bing\.|yahoo\.|baidu\.|duckduckgo/i.test(ref)) source = 'search';
            else if (/facebook\.|instagram\.|linkedin\.|twitter\.|youtube\.|whatsapp\.|pinterest\./i.test(ref)) source = 'social';
            else if (ref) source = 'referral';
          } catch (e) {}
          var kw = '';
          try { var u = new URL(location.href); if (u.searchParams.get('q')) kw = u.searchParams.get('q'); else if (u.searchParams.get('s')) kw = u.searchParams.get('s'); else if (u.searchParams.get('keyword')) kw = u.searchParams.get('keyword'); } catch (e) {}
          var dev = /mobile|android|iphone/i.test(navigator.userAgent) ? 'mobile' : (/tablet|ipad/i.test(navigator.userAgent) ? 'tablet' : 'desktop');
          var body = { page: location.pathname, ref: ref.slice(0, 300), source: source, device: dev, keyword: kw.slice(0, 120), session: sid };
          var send = function (b) {
            try { if (navigator.sendBeacon) { navigator.sendBeacon('/api/track', new Blob([JSON.stringify(b)], { type: 'application/json' })); } else { fetch('/api/track', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(b), keepalive: true }).catch(function () {}); } } catch (e) {}
          };
          send(body);
          window.__miliTrack = function (extra) { send(Object.assign({ page: location.pathname, source: source, device: dev, session: sid }, extra || {})); };
        } catch (e) {}
      })();
    </script>
