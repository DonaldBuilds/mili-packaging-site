name: Deploy to Cloudflare Worker
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Create .env from secrets
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
      - name: Regenerate sitemap
        run: node scripts/gen-sitemap.mjs
      - name: Build site
        run: npm run build
      - name: Prepare dist-seo (exclude images)
        run: |
          rm -rf dist-seo
          mkdir -p dist-seo
          cp -r dist/. dist-seo/
          find dist-seo -type f \( -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' -o -name '*.webp' -o -name '*.mp4' \) -delete
      - name: Deploy to Cloudflare Worker
        run: node deploy.cjs
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ADMIN_PW_HASH: ${{ secrets.ADMIN_PW_HASH }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
          OPS_GH_PAT: ${{ secrets.OPS_GH_PAT }}
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          GA4_SERVICE_JSON: ${{ secrets.GA4_SERVICE_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SERVICE_JSON: ${{ secrets.GSC_SERVICE_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
